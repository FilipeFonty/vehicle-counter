services:
  vehicle-counter:
    build:
      context: .
      dockerfile: Dockerfile
    image: vehicle-counter:latest
    container_name: vehicle-counter
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    environment:
      # Limita threads do ONNX Runtime, aproximando o comportamento de
      # um dispositivo de 4 nucleos como a Raspberry Pi 5.
      - OMP_NUM_THREADS=4
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
