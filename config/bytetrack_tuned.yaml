tracker_type: bytetrack

# Deteccoes acima deste limiar iniciam a associacao principal.
# Padrao 0.25 -> subimos para reduzir tracks espurios distantes.
track_high_thresh: 0.40

# Deteccoes fracas usadas na segunda passada da associacao.
# E o diferencial do ByteTrack: recupera veiculos parcialmente
# ocluidos que cairiam fora com um limiar unico.
track_low_thresh: 0.10

# Confianca minima para CRIAR um track novo.
# Este e o parametro que mais ataca os 73 efemeros.
new_track_thresh: 0.55

# Frames que um track sobrevive sem deteccao antes de morrer.
# Padrao 30 (1s a 30fps) -> 60 (2s) tolera oclusao mais longa,
# atacando o caso de teste 9 do enunciado.
track_buffer: 60

# Limiar de IoU para associar deteccao a track existente.
match_thresh: 0.85

fuse_score: true